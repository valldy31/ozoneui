    const showcaseContainer = document.getElementById('showcase-rows');
    const showcaseBadge = document.getElementById('showcase-count-badge');
    let activeScCat = 'all';
    let scQuery = '';

    function renderShowcaseRows() {
      if (!showcaseContainer) return;
      const filtered = SHOWCASE_SPECS.filter((item) => {
        const matchCat = activeScCat === 'all' || item.cat === activeScCat;
        const q = scQuery.trim().toLowerCase();
        const matchQ = !q || item.tag.toLowerCase().includes(q) || item.desc.toLowerCase().includes(q) || item.props.join(' ').toLowerCase().includes(q);
        return matchCat && matchQ;
      });

      if (showcaseBadge) showcaseBadge.setAttribute('label', `${filtered.length} Component${filtered.length === 1 ? '' : 's'}`);
      showcaseContainer.innerHTML = '';

      if (filtered.length === 0) {
        showcaseContainer.innerHTML = `<oz-alert variant="amber" title="No matching components" message="Try clearing the search query or selecting All (66)."></oz-alert>`;
        return;
      }

      filtered.forEach((item) => {
        const row = document.createElement('div');
        row.className = 'showcase-row';
        row.dataset.showcaseTag = item.tag;

        const left = document.createElement('div');
        left.className = 'oz-stack';
        left.style.gap = '12px';
        left.innerHTML = `
          <div class="oz-between">
            <div class="oz-row" style="gap:8px;">
              <code style="font-size:0.98rem;font-weight:600;color:var(--oz-primary);">&lt;${item.tag}&gt;</code>
              <oz-badge variant="violet">${item.catLabel}</oz-badge>
            </div>
          </div>
          <p class="oz-text-sm oz-muted" style="line-height:1.6;">${item.desc}</p>
          <div class="oz-row" style="gap:10px;">
            ${item.props.map((p) => `<span class="oz-badge" style="font-family:var(--oz-font-mono);font-size:0.7rem;">${p}</span>`).join('')}
          </div>
          <pre style="margin:0;padding:11px 13px;border-radius:var(--oz-radius-sm);background:var(--oz-surface-inset);border:1px solid var(--oz-border);font-size:0.73rem;overflow:auto;"></pre>
          <div class="oz-row" style="gap:8px;">
            <button type="button" class="oz-btn oz-btn--sm oz-btn--primary" data-copy-html><oz-icon name="copy" size="13"></oz-icon> Copy HTML</button>
            <button type="button" class="oz-btn oz-btn--sm oz-btn--glass" data-copy-ai><oz-icon name="bot" size="13"></oz-icon> Copy AI Prompt</button>
          </div>
        `;
        left.querySelector('pre').textContent = item.code;
        left.querySelector('[data-copy-html]')?.addEventListener('click', () => {
          navigator.clipboard?.writeText(item.code).catch(() => {});
          Ozone.sound.success();
          Ozone.toast({ title: 'HTML Copied', message: `Copied <${item.tag}> snippet.`, variant: 'emerald' });
        });
        left.querySelector('[data-copy-ai]')?.addEventListener('click', () => {
          const p = `Use OzoneUI <${item.tag}> (${item.desc}). Props: ${item.props.join(', ')}. Example: ${item.code}`;
          navigator.clipboard?.writeText(p).catch(() => {});
          Ozone.sound.success();
          Ozone.toast({ title: 'AI Prompt Copied', message: `Copied prompt for <${item.tag}>.`, variant: 'violet' });
        });

        const right = document.createElement('div');
        right.className = 'showcase-preview';
        right.innerHTML = item.preview;

        right.querySelector('[data-sc-open-dialog]')?.addEventListener('click', () => sampleDialog?.show());
        right.querySelector('[data-sc-open-cmd]')?.addEventListener('click', () => document.querySelector('oz-command')?.open());
        right.querySelector('[data-sc-open-insp]')?.addEventListener('click', () => document.querySelector('oz-inspector')?.toggle());
        right.querySelector('[data-sc-open-gdpr]')?.addEventListener('click', () => document.querySelector('oz-cookie-consent')?.open());

        row.appendChild(left);
        row.appendChild(right);
        showcaseContainer.appendChild(row);
      });
    }

    document.querySelectorAll('#showcase-filters [data-sc-cat]').forEach((btn) => {
      btn.addEventListener('click', () => {
        activeScCat = btn.dataset.scCat;
        document.querySelectorAll('#showcase-filters [data-sc-cat]').forEach((b) => {
          b.className = `oz-btn oz-btn--sm ${b === btn ? 'oz-btn--primary' : 'oz-btn--glass'}`;
        });
                Ozone.sound.click();
        renderShowcaseRows();
      });
    });

    document.getElementById('showcase-search')?.addEventListener('oz-input', (e) => {
      scQuery = e.detail.value;
      renderShowcaseRows();
    });

    renderShowcaseRows();
  </script>
